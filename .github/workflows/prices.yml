name: Uppdatera priser
on:
  schedule: [{ cron: "17 */6 * * *" }]   # var 6:e timme
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/build_data.py --prices

      # Snapshoten publiceras på grenen "prices" som EN enda commit som skrivs över varje gång.
      # Då växer inte Git-historiken (tidigare ca 100 MB/månad) och Cloudflare behöver inte bygga om sidan.
      - name: Publicera prissnapshot
        run: |
          set -e
          mkdir /tmp/pub && cp site/data/prices.json /tmp/pub/
          # Prishistorik: hämta förra versionen från grenen "prices" och lägg till dagens priser
          git fetch -q --depth=1 origin prices || true
          git show FETCH_HEAD:history.json > /tmp/history_prev.json 2>/dev/null || echo '{}' > /tmp/history_prev.json
          python tools/history.py site/data/prices.json /tmp/history_prev.json /tmp/pub/history.json
          cd /tmp/pub
          git init -q -b prices
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.json history.json
          git commit -q -m "Prissnapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -q -f origin prices

      # GitHub stänger av schemalagda jobb i offentliga repon utan aktivitet i 60 dagar.
      # Därför görs en liten commit på main den första dagen varje månad.
      - name: Håll schemat vid liv
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" -lt 6 ]; then
            echo "$(date -u +%Y-%m-%dT%H:%MZ)" > .github/keepalive.txt
            git config user.name "price-bot"
            git config user.email "bot@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -q -m "Keepalive" && git push -q
          fi
